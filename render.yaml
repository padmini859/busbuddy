# ===================================================================
# Render.com Blueprint Configuration for BusBuddy
# Deploys:
#   1. busbuddy-backend  (Spring Boot 3 + Java 21 Web Service)
#   2. busbuddy-frontend (React 18 + Vite Static Site with SPA rewrites)
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. Spring Boot Java 21 Backend Web Service
  # -----------------------------------------------------------------
  - type: web
    name: busbuddy-backend
    runtime: docker
    dockerContext: busbuddy/backend
    dockerfilePath: busbuddy/backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/stops/popular
    envVars:
      - key: DB_HOST
        sync: false # Enter your Cloud MySQL host (e.g. from Aiven or TiDB)
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "busbuddy_db"
      - key: MYSQL_USER
        sync: false # Enter your Cloud MySQL username
      - key: MYSQL_PASSWORD
        sync: false # Enter your Cloud MySQL password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173,*"

  # -----------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # -----------------------------------------------------------------
  - type: web
    name: busbuddy-frontend
    runtime: static
    rootDir: busbuddy/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Rewrite rule so page refreshes don't return 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: busbuddy-backend
          property: host
          # Render automatically constructs the backend URL
