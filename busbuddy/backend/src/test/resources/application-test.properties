# H2 In-Memory DB for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:busbuddy_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=busbuddy_super_secure_jwt_secret_token_key_2026_at_least_256_bits_long_for_security
jwt.expiration-ms=86400000
