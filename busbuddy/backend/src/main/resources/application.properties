# ===================================================================
# BusBuddy — Smart Local Bus Information System Configuration
# ===================================================================
server.port=8080
spring.application.name=busbuddy-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:busbuddy_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:MySQL@2026#Padmini}

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security
jwt.secret=${JWT_SECRET:busbuddy_super_secure_jwt_secret_token_key_2026_at_least_256_bits_long_for_security}
jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://*.onrender.com,https://*.vercel.app,*}

# Logging
logging.level.com.busbuddy=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
