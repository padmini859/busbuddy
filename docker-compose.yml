version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. MySQL Database Service
  # -------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: busbuddy_db
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-MySQL@2026#Padmini}
      MYSQL_DATABASE: ${DB_NAME:-busbuddy_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./busbuddy/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./busbuddy/database/seed_demo_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-MySQL@2026#Padmini}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busbuddy-network

  # -------------------------------------------------------------------
  # 2. Spring Boot 3 Backend API Service
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./busbuddy/backend
      dockerfile: Dockerfile
    container_name: busbuddy_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-busbuddy_db}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MySQL@2026#Padmini}
      JWT_SECRET: ${JWT_SECRET:-busbuddy_super_secure_jwt_secret_token_key_2026_at_least_256_bits_long_for_security}
      JWT_EXPIRATION_MS: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - busbuddy-network

  # -------------------------------------------------------------------
  # 3. React Frontend Service (Served via Nginx)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./busbuddy/frontend
      dockerfile: Dockerfile
    container_name: busbuddy_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - busbuddy-network

volumes:
  mysql_data:
    driver: local

networks:
  busbuddy-network:
    driver: bridge
